# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 0.66.0

package:
  name: feast
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/feast/feast-${{ version }}.tar.gz
  sha256: 4d059be34bc2f30e4dff976ce0d2a014fc364fe4d1354c3c44ccf74d78f24567

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core
  run:
    - python >=${{ python_min }}
    - click >=7.0.0,<9.0.0
    - colorama >=0.3.9,<1
    - dill >=0.3.0,<0.4.dev0
    - protobuf >=4.24.0
    - jinja2 >=2,<4
    - mmh3
    - numpy >=2.0.0,<3
    - pandas >=1.4.3,<3
    - pyarrow >=16.1.0
    - pydantic >=2.10.6
    - pygments >=2.12.0,<3
    - pyyaml >=5.4.0,<7
    - requests
    - sqlalchemy >1
    - tabulate >=0.8.0,<1
    - tenacity >=7,<9
    - toml >=0.10.0,<1
    - tqdm >=4,<5
    - typeguard >=4.0.0
    - fastapi >=0.68.0
    - uvicorn >=0.30.6
    - uvicorn-worker
    - gunicorn
    - dask-core >=2024.2.1
    - prometheus_client >=0.20.0,<0.25.0
    - psutil
    - bigtree >=0.19.2
    - pyjwt >=2.13.0
    - starlette >=1.0.1
    - attrs
tests:
  - python:
      imports:
        - feast
      pip_check: true
      # multiprocess 0.70.18 has requirement dill>=0.4.0, but you have dill 0.3.9.
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
    script:
      - feast --help

about:
  homepage: https://github.com/feast-dev/feast
  license: Apache-2.0
  license_file: LICENSE
  summary: Python SDK for Feast
  description: |
    Python SDK for Feast

extra:
  recipe-maintainers:
    - rxm7706
